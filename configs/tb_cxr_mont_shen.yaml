# Example config for `run_experiment.py --config configs/tb_cxr_mont_shen.yaml`.
#
# Single-modality (chest X-ray only) TB classification on the combined Montgomery +
# Shenzhen TB Chest X-ray sets (see datasets/tb_cxr_mont_shen/download.py) - a much
# smaller (800 vs. 4,200 images) but far better-documented alternative to
# configs/tb_cxr_qatar.yaml: every non-normal label here traces to readable radiological/
# clinical findings text, rather than an opaque folder name that (per this project's
# investigation) turned out to pool two different reference standards undocumented on the
# dataset page.
#
# Requires data/tb_cxr_mont_shen/tb_cxr_mont_shen.pkl - build it first with:
#   pip install -e '.[google_health]'
#   python -m datasets.tb_cxr_mont_shen.download --output data/tb_cxr_mont_shen/tb_cxr_mont_shen.pkl

dataset:
  name: tb_cxr_mont_shen
  path: data/tb_cxr_mont_shen/tb_cxr_mont_shen.pkl
  kwargs:
    batch_size: 16

model:
  features:
    - type: vgg11_slim           # chest X-ray, 3x224x224 (ImageNet-pretrained, frozen
      args: [128]                # backbone, small trainable head) -> [B, 128]
  fusion:
    type: concat                 # single modality - Concat just flattens/passes it through
  classifier:
    type: mlp
    args: [128, 64, 2]

training:
  task: classification
  epochs: 15
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  objective: cross_entropy
  # Roughly balanced (~49% positive across both sets combined) - recompute from the actual
  # train split's printed class counts if you rebuild the dataset with a different seed.
  objective_kwargs:
    weight: [1.0, 1.0]
  is_packed: false
  early_stop: true
  save: results/models/tb_cxr_mont_shen_from_config.pt

evaluation:
  - UA
  - WA
  - F1
