# Example config for `run_experiment.py --config configs/google_health_tb.yaml`.
#
# TB screening on the Google + CIDRZ Health AI Evaluation Zambia dataset
# (https://www.kaggle.com/datasets/googlehealthai/google-health-ai), combining three
# modalities per participant: clinical/demographic fields (text), a cough recording
# (audio) and a chest X-ray (image). Ground truth is `ground_truth_tb` (culture/Xpert
# confirmed TB), not Google's own AI predictions - those columns are excluded as features.
#
# Requires data/google_health/tb_dataset.pkl - build it first with:
#   pip install -e '.[google_health]'
#   python -m datasets.google_health.download --output data/google_health/tb_dataset.pkl

dataset:
  name: google_health
  path: data/google_health/tb_dataset.pkl
  kwargs:
    batch_size: 8

model:
  features:
    - type: mlp                  # clinical/demographic fields
      args: [16, 32, 16]
    - type: mlp                  # cough audio, log-spectral summary
      args: [64, 64, 32]
    - type: vgg11_slim           # chest X-ray, 3x224x224 (ImageNet-pretrained, frozen
      args: [128]                # backbone, small trainable head) -> [B, 128]. Requires
                                  # data/google_health/tb_dataset.pkl built with
                                  # --image-encoder vgg11_slim (the default).
  fusion:
    type: concat
  classifier:
    type: mlp
    args: [176, 128, 2]

training:
  task: classification
  epochs: 15
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  objective: cross_entropy
  # Inverse-frequency class weights on the train split (191 neg / 39 pos out of 230):
  # 230/(2*191)=0.60, 230/(2*39)=2.95. Without this, plain cross-entropy's easiest
  # low-loss solution at ~17% positive rate is "always predict negative" - which is
  # exactly the majority-class collapse the unweighted baseline hit (UA=0.5, F1=0.459).
  # Recompute these two numbers (n/(2*n_neg), n/(2*n_pos)) if you rebuild the dataset
  # with a different --max-samples/--include-phone-audio - they're specific to this
  # dataset's train split size and class balance, not a general-purpose constant.
  objective_kwargs:
    weight: [0.602, 2.949]
  is_packed: false
  early_stop: true
  save: results/models/google_health_tb_from_config.pt

evaluation:
  - UA
  - WA
  - F1
