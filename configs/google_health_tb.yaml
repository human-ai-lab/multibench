# Example config for `run_experiment.py --config configs/google_health_tb.yaml`.
#
# TB screening on the Google + CIDRZ Health AI Evaluation Zambia dataset
# (https://www.kaggle.com/datasets/googlehealthai/google-health-ai), combining three
# modalities per participant: clinical/demographic fields (text), a cough recording
# (audio) and a chest X-ray (image). Ground truth is `ground_truth_tb` (culture/Xpert
# confirmed TB), not Google's own AI predictions - those columns are excluded as features.
#
# Requires data/google_health/tb_dataset.pkl - build it first with:
#   pip install -e '.[google_health]'
#   python -m datasets.google_health.download --output data/google_health/tb_dataset.pkl

dataset:
  name: google_health
  path: data/google_health/tb_dataset.pkl
  kwargs:
    batch_size: 8

model:
  features:
    - type: mlp                  # clinical/demographic fields
      args: [16, 32, 16]
    - type: mlp                  # cough audio, log-spectral summary
      args: [64, 64, 32]
    - type: lenet                # chest X-ray, 1x64x64 -> [B, 128, 1, 1]
      args: [1, 4, 5]
      kwargs: {squeeze_output: false}  # LeNet's default squeeze() also drops the batch
                                        # dim on a size-1 batch (e.g. an uneven last batch);
                                        # Concat's flatten(start_dim=1) handles [B,128,1,1]
                                        # correctly at any batch size, so keep it unsqueezed.
  fusion:
    type: concat
  classifier:
    type: mlp
    args: [176, 128, 2]

training:
  task: classification
  epochs: 15
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.01
  objective: cross_entropy
  # Inverse-frequency class weights on the train split (130 neg / 24 pos out of 154):
  # 154/(2*130)=0.59, 154/(2*24)=3.21. Without this, plain cross-entropy's easiest
  # low-loss solution at ~15.5% positive rate is "always predict negative" - which is
  # exactly the majority-class collapse the unweighted baseline hit (UA=0.5, F1=0.459).
  objective_kwargs:
    weight: [0.59, 3.21]
  is_packed: false
  early_stop: true
  save: results/models/google_health_tb_from_config.pt

evaluation:
  - UA
  - WA
  - F1
